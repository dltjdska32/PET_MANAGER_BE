plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.0.21' apply false
}

//bootJar로 생성된 .jar는 java -jar {.jar-file-name} 명령어로 실행되는 Executable Archive지만
// jar로 생성된 .jar는 실행되지 않는 Plain Archive입니다.

//Plain Archive: 애플리케이션 실행에 필요한 의존성을 제외한 모든 리소스 파일과 빌드된 소스코드의
// 클래스 파일만 포함됩니다.
//Executable Archive: 애플리케이션 실행에 필요한 의존성까지 모두 포함됩니다.

//module-global처럼 실행이 필요하지 않은 모듈은 bootJar를 비활성화 하고 jar만 활성화 해줍니다.
bootJar.enabled = false

allprojects {
    group = 'com.pet-manager'
    version = '0.0.1-SNAPSHOT'
    description = 'PET_MANAGER_BE'

    afterEvaluate {
        if (project.plugins.hasPlugin('java')) {
            tasks.named('compileJava').configure { it.options.encoding = 'UTF-8' }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

}


ext {
    JJWT_VERSION = "0.12.5"
    QUERYDSL_VERSION = "5.0.0"
    WEBMVC_VERSION = "2.8.13"
}

repositories {
    mavenCentral()
}

subprojects { // 모든 하위 모듈들에 이 설정을 적용합니다.
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'


    tasks.named('test') {
        useJUnitPlatform()
        enabled = false  /// 테스트 진행시 true로변경
    }



    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {

        if (project.name != 'module-feed') {
            compileOnly 'org.projectlombok:lombok'
            annotationProcessor 'org.projectlombok:lombok'
        }

        developmentOnly 'org.springframework.boot:spring-boot-devtools'

        implementation 'org.springframework.boot:spring-boot-starter-security'

        implementation "io.jsonwebtoken:jjwt-api:${JJWT_VERSION}"
        runtimeOnly "io.jsonwebtoken:jjwt-gson:${JJWT_VERSION}"
        runtimeOnly "io.jsonwebtoken:jjwt-impl:${JJWT_VERSION}"



    }





}




