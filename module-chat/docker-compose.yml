version: '3.8'

services:
  chat:
    build:
      context: ../
      dockerfile: module-chat/Dockerfile
    container_name: pet-manager-chat
    restart: always
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      # env_file(127.0.0.1) 대신 Docker 네트워크 호스트명 사용
      MONGODB_URI: mongodb://lsn:petmanager3448%21%21@pet-manager-mongodb:27017/pet_manager_chat?authSource=admin&replicaSet=rs0
      REDIS_URL: redis://:petmanager3448%21%21@pet-manager-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      AWS_CREDENTIALS_ACCESS_KEY: ${AWS_CREDENTIALS_ACCESS_KEY}
      AWS_CREDENTIALS_SECRET_KEY: ${AWS_CREDENTIALS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    networks:
      - pet-manager-network

networks:
  pet-manager-network:
    external: true
    name: pet-manager-network
