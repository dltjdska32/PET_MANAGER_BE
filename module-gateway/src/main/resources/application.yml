server:
  port: 8080

spring:
  application:
    name: module-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=0

            - id: feed-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/feed/**
              filters:
                - StripPrefix=0

            - id: chat-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/chat/**
              filters:
                - StripPrefix=0

jwt:
  secret: ${JWT_SECRET:}
  access-expiration: 1800   # 30분 = 30 * 60 * 1000 1800000
  refresh-expiration: 604800000 # 7일 = 7 * 24 * 60 * 60 * 1000
