server:
  port: 8080

# Actuator (헬스체크) - CI 블루그린 배포용
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: false  # Gateway 단독 인스턴스에 Redis 없을 수 있음 - health에서 제외

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    com.petmanager: INFO

spring:
  application:
    name: module-gateway

  # ============================================
  # Profile 설정
  # ============================================
  # local: 로컬 개발 환경 (application-local.yml 자동 로드)
  # prod: 프로덕션 환경 (환경 변수 또는 application-prod.yml 사용)
  profiles:
    # 컨테이너/운영에서 local 강제 로딩되면(application-local.yml 미존재) JWT_SECRET 미주입으로 기동 실패할 수 있음
    active: local


  main:
    web-application-type: reactive

  # ============================================
  # Spring Cloud Gateway 설정
  # ============================================
  # 로컬: 기본값 localhost 사용
  # 프로덕션: 환경 변수로 각 서비스 URI 주입 (EC2/배포 시 설정)
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Auth 서비스 라우팅
            - id: auth-service
              # 포트 미지정 시 기본 80으로 떨어지는 사고 방지
              uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=0

            # Feed 서비스 라우팅
            # feed 서비스가 context-path=/api/feed 를 사용해서
            #       /api/feed 요청이 /api/feed/ 로 302 redirect 되는 케이스가 있음.
            #       클라이언트에 302(내부 IP Location)가 노출되지 않도록, 루트 경로는 미리 /api/feed/ 로 보정한다.
            - id: feed-service-root-slash
              uri: ${FEED_SERVICE_URI:http://feed-service:8082}
              predicates:
                - Path=/api/feed
              filters:
                - SetPath=/api/feed/

            - id: feed-service
              uri: ${FEED_SERVICE_URI:http://feed-service:8082}
              predicates:
                - Path=/api/feed/**
              filters:
                - PreserveHostHeader
                - StripPrefix=0

            # Chat 서비스 라우팅
            - id: chat-service
              uri: ${CHAT_SERVICE_URI:http://chat-service:8083}
              predicates:
                - Path=/api/chat/**
              filters:
                - StripPrefix=0

# ============================================
# JWT 설정
# ============================================
# 로컬: application-local.yml에서 실제 값 사용
# 프로덕션: GitHub Secrets 또는 환경 변수에서 주입
jwt:
  secret: ${JWT_SECRET:}  # 환경 변수 또는 application-local.yml에서 주입
  access-expiration: 1800000   # 30분 (밀리초)
  refresh-expiration: 604800000 # 7일 (밀리초 단위)
