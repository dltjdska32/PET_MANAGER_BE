ext {
    set('springCloudVersion', "2025.0.0")
}


dependencies {
    // module-global은 MVC여서 여기서는 사용하지 않음
    // implementation project(':module-global')

    // Spring Cloud 4.3.x 가 runtime 에 properties-migrator 를 끌어오는데,
    // Boot 3.5 와 조합 시 ConfigurationMetadataRepositoryJsonBuilder 등으로 NoClassDefFoundError 가 날 수 있음(런타임에 불필요).
    implementation('org.springframework.cloud:spring-cloud-starter-gateway-server-webflux') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-properties-migrator'
    }
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive' // Reactive Redis
    
    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${JJWT_VERSION}"
    runtimeOnly "io.jsonwebtoken:jjwt-gson:${JJWT_VERSION}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${JJWT_VERSION}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}
