# ============================================
# Gateway Service CI/CD Pipeline
# ============================================
# 이 workflow는 Gateway 모듈만을 빌드하고 배포합니다.
#
# [필수 GitHub Secrets]
# - DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# - EC2_HOST_GATEWAY
# - EC2_USER, EC2_SSH_KEY
# - JWT_SECRET
# MSA 구조에서 각 서비스는 독립적으로 배포되므로,
# Gateway 모듈이 변경되었을 때만 실행됩니다.

name: Gateway Service CI/CD

# ============================================
# Workflow 트리거 설정
# ============================================
on:
  # 머지 시 자동 실행 원하면 아래 주석 해제
  # push:
  #   branches:
  #     - main
  #     - dev
  #   paths:
  #     - 'module-gateway/**'
  #     - '.github/workflows/gateway-ci.yml'

  workflow_dispatch:
    inputs:
      tags:
        description: '배포 버전 태그 (예: v1.0.0)'
        required: true
        default: latest
        type: string

# ============================================
# Job 정의
# ============================================
jobs:
  # 빌드 및 배포 Job
  build-and-deploy:
    # 실행 환경: GitHub에서 제공하는 Ubuntu 최신 버전
    runs-on: ubuntu-latest

    # Job 출력값: 다른 Job에서 사용할 수 있는 값
    outputs:
      # 빌드된 버전명을 다른 Job에서 참조 가능
      version: ${{ steps.set-version.outputs.VERSION_NAME }}
      jar-path: ${{ steps.build.outputs.JAR_PATH }}

    # ============================================
    # Step 1: 버전명 설정
    # ============================================
    steps:
      - name: Set Version Name
        id: set-version
        # 버전명 변환: v1.0.0 → v1-0-0 (파일명에 사용하기 위해)
        # workflow_dispatch로 실행 시 입력값 사용, push로 실행 시 기본값 사용
        run: |
          VERSION_TAG="${{ github.event.inputs.tags || 'latest' }}"
          VERSION_NAME=$(echo "$VERSION_TAG" | sed "s/\./\-/g")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "버전명 설정: $VERSION_NAME"

      # ============================================
      # Step 2: 소스 코드 체크아웃
      # ============================================
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # workflow_dispatch로 실행 시 입력한 태그/브랜치 사용
          # push로 실행 시 현재 브랜치 사용
          ref: ${{ github.event.inputs.tags || github.ref }}

      # ============================================
      # Step 3: Gradle Wrapper 실행 권한 부여
      # ============================================
      - name: Grant Execute Permission for Gradlew
        # chmod +x: 실행 권한 부여 (기존 +w는 쓰기 권한이므로 수정)
        # Gradle Wrapper를 실행하기 위해 필요
        run: chmod +x gradlew

      # ============================================
      # Step 4: JDK 21 설정
      # ============================================
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          # distribution: 'temurin' (Eclipse Temurin - Oracle보다 안정적이고 무료)
          # Oracle JDK는 라이선스 제약이 있을 수 있음
          distribution: 'temurin'

      # ============================================
      # Step 5: Gateway 모듈 빌드
      # ============================================
      - name: Build Gateway Module
        id: build
        # :module-gateway:bootJar - 특정 모듈만 빌드 (MSA 구조에 맞음)
        # -x test: 테스트 제외 (빠른 빌드를 위해, 필요시 제거)
        # bootJar: 실행 가능한 JAR 파일 생성
        run: |
          echo "Gateway 모듈 빌드 시작..."
          ./gradlew :module-gateway:clean :module-gateway:bootJar -x test
          
          # 빌드된 JAR 파일 경로 저장 (다음 단계에서 사용)
          JAR_PATH="module-gateway/build/libs/module-gateway-0.0.1-SNAPSHOT.jar"
          if [ -f "$JAR_PATH" ]; then
            echo "JAR_PATH=$JAR_PATH" >> $GITHUB_OUTPUT
            echo "빌드 완료: $JAR_PATH"
          else
            echo "빌드 실패: JAR 파일을 찾을 수 없습니다"
            exit 1
          fi
        env:
          # GitHub Secrets에서 환경 변수 주입
          # Repository → Settings → Secrets and variables → Actions에서 설정 필요
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_PROFILES_ACTIVE: prod  # 프로덕션 환경으로 빌드

      # ============================================
      # Step 6: JAR 파일 버전명 변경
      # ============================================
      - name: Rename JAR with Version
        # 빌드된 JAR 파일을 버전명이 포함된 이름으로 변경
        # 예: module-gateway-0.0.1-SNAPSHOT.jar → module-gateway-v1-0-0.jar
        run: |
          cd module-gateway/build/libs
          OLD_JAR="module-gateway-0.0.1-SNAPSHOT.jar"
          NEW_JAR="module-gateway-${{ steps.set-version.outputs.VERSION_NAME }}.jar"
          
          if [ -f "$OLD_JAR" ]; then
            mv "$OLD_JAR" "$NEW_JAR"
            echo "파일명 변경: $OLD_JAR -> $NEW_JAR"
            echo "최종 JAR: $NEW_JAR"
          else
            echo "JAR 파일을 찾을 수 없습니다: $OLD_JAR"
            exit 1
          fi

      # ============================================
      # Step 7: 빌드 아티팩트 업로드
      # ============================================
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          # 아티팩트 이름: GitHub Actions UI에서 다운로드할 때 사용
          name: gateway-service-${{ steps.set-version.outputs.VERSION_NAME }}
          # 업로드할 파일 경로
          path: module-gateway/build/libs/module-gateway-${{ steps.set-version.outputs.VERSION_NAME }}.jar
          # 아티팩트 보관 기간 (일)
          retention-days: 7

      # ============================================
      # Step 8: Docker 이미지 빌드
      # ============================================
      - name: Build Docker Image
        if: success()
        run: |
          echo "Docker 이미지 빌드 시작..."
          docker build -f module-gateway/Dockerfile -t pet-manager-gateway:${{ steps.set-version.outputs.VERSION_NAME }} .
          docker build -f module-gateway/Dockerfile -t pet-manager-gateway:latest .
          echo "Docker 이미지 빌드 완료"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_PROFILES_ACTIVE: prod

      # ============================================
      # Step 9: Docker Hub 로그인 및 푸시
      # ============================================
      - name: Login to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: success()
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DOCKER_USER=$(echo -n "$DOCKER_USER" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')
          if [ -z "$DOCKER_USER" ]; then
            echo "::error::DOCKERHUB_USERNAME 시크릿이 비어있습니다. GitHub Settings > Secrets에서 설정하세요."
            exit 1
          fi
          IMAGE_BASE="${DOCKER_USER}/pet-manager-gateway"
          echo "Docker Hub에 이미지 푸시..."
          docker tag pet-manager-gateway:latest ${IMAGE_BASE}:latest
          docker tag pet-manager-gateway:${{ steps.set-version.outputs.VERSION_NAME }} ${IMAGE_BASE}:${{ steps.set-version.outputs.VERSION_NAME }}
          docker push ${IMAGE_BASE}:latest
          docker push ${IMAGE_BASE}:${{ steps.set-version.outputs.VERSION_NAME }}
          echo "Docker Hub 푸시 완료"

      # ============================================
      # Step 10: EC2 배포
      # ============================================
      - name: Deploy to EC2 (Gateway Blue-Green)
        if: success() && github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_AUTH_FEED_IP: ${{ secrets.INTERNAL_AUTH_FEED_IP }}
        with:
          host: ${{ secrets.EC2_HOST_GATEWAY }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,JWT_SECRET,INTERNAL_AUTH_FEED_IP
          script: |
            set -e
            echo "Docker Hub 로그인..."
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            sudo mkdir -p /opt/pet-manager
            CURRENT=$(cat /opt/pet-manager/gateway_slot 2>/dev/null || echo "blue")
            if [ "$CURRENT" = "blue" ]; then
              TARGET="green"
              PORT=8081
              CONTAINER_NAME="pet-manager-gateway-green"
            else
              TARGET="blue"
              PORT=8080
              CONTAINER_NAME="pet-manager-gateway-blue"
            fi
            echo "현재 Gateway 슬롯: $CURRENT → 배포 대상: $TARGET (포트 $PORT)"

            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true
            docker pull $DOCKERHUB_USERNAME/pet-manager-gateway:latest

            if [ -z "$INTERNAL_AUTH_FEED_IP" ]; then
              echo "::error::INTERNAL_AUTH_FEED_IP 시크릿이 비어있습니다. (AUTH/FEED URI 생성 불가)"
              exit 1
            fi
            echo "INTERNAL_AUTH_FEED_IP=$INTERNAL_AUTH_FEED_IP"

            docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              -p ${PORT}:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e JWT_SECRET="$JWT_SECRET" \
              -e AUTH_SERVICE_URI="http://$INTERNAL_AUTH_FEED_IP:8081" \
              -e FEED_SERVICE_URI="http://$INTERNAL_AUTH_FEED_IP:8082" \
              $DOCKERHUB_USERNAME/pet-manager-gateway:latest

            echo "헬스체크 대기 (최대 30초)..."
            for i in $(seq 1 15); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 http://127.0.0.1:${PORT}/actuator/health 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "헬스체크 성공"
                break
              fi
              if [ $i -eq 15 ]; then
                echo "::error::헬스체크 실패 (30초 초과, 마지막 응답: $CODE)"
                echo "가능한 원인: 1) 앱 기동 지연 2) /actuator/health가 503(Redis 등) 3) 앱 크래시. 컨테이너 로그:"
                docker ps -a --filter "name=$CONTAINER_NAME" || true
                echo "--- docker logs (tail 300) ---"
                docker logs $CONTAINER_NAME --tail 300 || true
                echo "--- docker inspect env ---"
                docker inspect $CONTAINER_NAME --format='{{range .Config.Env}}{{println .}}{{end}}' | sed -E 's/(JWT_SECRET=).+/\1***MASKED***/' || true
                exit 1
              fi
              sleep 2
            done

            NGINX_CFG="/etc/nginx/sites-available/pet-manager-gateway"
            if [ "$TARGET" = "green" ]; then
              sudo sed -i 's/server 127.0.0.1:8080;/server 127.0.0.1:8081;/' $NGINX_CFG
            else
              sudo sed -i 's/server 127.0.0.1:8081;/server 127.0.0.1:8080;/' $NGINX_CFG
            fi
            sudo nginx -t && sudo systemctl reload nginx
            echo "$TARGET" | sudo tee /opt/pet-manager/gateway_slot > /dev/null

            OLD_CONTAINER="pet-manager-gateway-blue"
            [ "$TARGET" = "blue" ] && OLD_CONTAINER="pet-manager-gateway-green"
            docker stop $OLD_CONTAINER 2>/dev/null || true
            docker rm $OLD_CONTAINER 2>/dev/null || true

            echo "Gateway 배포 완료 (활성 슬롯: $TARGET)"