# ============================================
# Auth Service CI/CD Pipeline
# ============================================
# module-auth, module-global 변경 시에만 실행됩니다.

name: Auth Service CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'module-auth/**'
      - 'module-global/**'
      - '.github/workflows/auth-ci.yml'

  workflow_dispatch:
    inputs:
      tags:
        description: '배포 버전 태그 (예: v1.0.0)'
        required: true
        default: latest
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set-version.outputs.VERSION_NAME }}
      jar-path: ${{ steps.build.outputs.JAR_PATH }}

    steps:
      - name: Set Version Name
        id: set-version
        run: |
          VERSION_TAG="${{ github.event.inputs.tags || 'latest' }}"
          VERSION_NAME=$(echo "$VERSION_TAG" | sed "s/\./\-/g")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "버전명 설정: $VERSION_NAME"

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tags || github.ref }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Auth Module
        id: build
        run: |
          echo "Auth 모듈 빌드 시작..."
          ./gradlew :module-auth:clean :module-auth:bootJar -x test
          
          JAR_PATH="module-auth/build/libs/module-auth-0.0.1-SNAPSHOT.jar"
          if [ -f "$JAR_PATH" ]; then
            echo "JAR_PATH=$JAR_PATH" >> $GITHUB_OUTPUT
            echo "빌드 완료: $JAR_PATH"
          else
            echo "빌드 실패: JAR 파일을 찾을 수 없습니다"
            exit 1
          fi
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_PROFILES_ACTIVE: prod

      - name: Rename JAR with Version
        run: |
          cd module-auth/build/libs
          OLD_JAR="module-auth-0.0.1-SNAPSHOT.jar"
          NEW_JAR="module-auth-${{ steps.set-version.outputs.VERSION_NAME }}.jar"
          
          if [ -f "$OLD_JAR" ]; then
            mv "$OLD_JAR" "$NEW_JAR"
            echo "파일명 변경: $OLD_JAR -> $NEW_JAR"
          else
            echo "JAR 파일을 찾을 수 없습니다: $OLD_JAR"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-${{ steps.set-version.outputs.VERSION_NAME }}
          path: module-auth/build/libs/module-auth-${{ steps.set-version.outputs.VERSION_NAME }}.jar
          retention-days: 7

      - name: Build Docker Image
        if: success()
        run: |
          echo "Docker 이미지 빌드 시작..."
          docker build -f module-auth/Dockerfile -t pet-manager-auth:${{ steps.set-version.outputs.VERSION_NAME }} .
          docker build -f module-auth/Dockerfile -t pet-manager-auth:latest .
          echo "Docker 이미지 빌드 완료"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_PROFILES_ACTIVE: prod

      - name: Login to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: success()
        run: |
          echo "Docker Hub에 이미지 푸시..."
          docker tag pet-manager-auth:latest ${{ secrets.DOCKERHUB_USERNAME }}/pet-manager-auth:latest
          docker tag pet-manager-auth:${{ steps.set-version.outputs.VERSION_NAME }} ${{ secrets.DOCKERHUB_USERNAME }}/pet-manager-auth:${{ steps.set-version.outputs.VERSION_NAME }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pet-manager-auth:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pet-manager-auth:${{ steps.set-version.outputs.VERSION_NAME }}
          echo "Docker Hub 푸시 완료"

      - name: Deploy to Server
        if: success()
        run: |
          echo "배포 시작..."
          echo "배포 환경: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}"
          echo "버전: ${{ steps.set-version.outputs.VERSION_NAME }}"
          echo "배포 완료 (실제 배포 로직 구현 필요)"
