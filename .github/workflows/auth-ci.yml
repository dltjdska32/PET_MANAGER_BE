name: Auth Service CI/CD

on:
  # 머지 시 자동 실행 원하면 아래 주석 해제
  # push:
  #   branches:
  #     - main
  #     - dev
  #   paths:
  #     - 'module-auth/**'
  #     - 'module-global/**'
  #     - '.github/workflows/auth-ci.yml'

  workflow_dispatch:
    inputs:
      tags:
        description: '배포 버전 태그 (예: v1.0.0)'
        required: true
        default: latest
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set-version.outputs.VERSION_NAME }}
      jar-path: ${{ steps.build.outputs.JAR_PATH }}

    steps:
      - name: Set Version Name
        id: set-version
        run: |
          VERSION_TAG="${{ github.event.inputs.tags || 'latest' }}"
          VERSION_NAME=$(echo "$VERSION_TAG" | sed "s/\./\-/g")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "버전명 설정: $VERSION_NAME"

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tags || github.ref }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Auth Module
        id: build
        run: |
          echo "Auth 모듈 빌드 시작..."
          ./gradlew :module-auth:clean :module-auth:bootJar -x test
          
          JAR_PATH="module-auth/build/libs/module-auth-0.0.1-SNAPSHOT.jar"
          if [ -f "$JAR_PATH" ]; then
            echo "JAR_PATH=$JAR_PATH" >> $GITHUB_OUTPUT
            echo "빌드 완료: $JAR_PATH"
          else
            echo "빌드 실패: JAR 파일을 찾을 수 없습니다"
            exit 1
          fi
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_PROFILES_ACTIVE: prod

      - name: Rename JAR with Version
        run: |
          cd module-auth/build/libs
          OLD_JAR="module-auth-0.0.1-SNAPSHOT.jar"
          NEW_JAR="module-auth-${{ steps.set-version.outputs.VERSION_NAME }}.jar"
          
          if [ -f "$OLD_JAR" ]; then
            mv "$OLD_JAR" "$NEW_JAR"
            echo "파일명 변경: $OLD_JAR -> $NEW_JAR"
          else
            echo "JAR 파일을 찾을 수 없습니다: $OLD_JAR"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-${{ steps.set-version.outputs.VERSION_NAME }}
          path: module-auth/build/libs/module-auth-${{ steps.set-version.outputs.VERSION_NAME }}.jar
          retention-days: 7

      - name: Build Docker Image
        if: success()
        run: |
          echo "Docker 이미지 빌드 시작..."
          docker build -f module-auth/Dockerfile -t pet-manager-auth:${{ steps.set-version.outputs.VERSION_NAME }} .
          docker build -f module-auth/Dockerfile -t pet-manager-auth:latest .
          echo "Docker 이미지 빌드 완료"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_PROFILES_ACTIVE: prod

      - name: Login to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: success()
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DOCKER_USER=$(echo -n "$DOCKER_USER" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')
          if [ -z "$DOCKER_USER" ]; then
            echo "::error::DOCKERHUB_USERNAME 시크릿이 비어있습니다. GitHub Settings > Secrets에서 설정하세요."
            exit 1
          fi
          IMAGE_BASE="${DOCKER_USER}/pet-manager-auth"
          echo "Docker Hub에 이미지 푸시..."
          docker tag pet-manager-auth:latest ${IMAGE_BASE}:latest
          docker tag pet-manager-auth:${{ steps.set-version.outputs.VERSION_NAME }} ${IMAGE_BASE}:${{ steps.set-version.outputs.VERSION_NAME }}
          docker push ${IMAGE_BASE}:latest
          docker push ${IMAGE_BASE}:${{ steps.set-version.outputs.VERSION_NAME }}
          echo "Docker Hub 푸시 완료"

      - name: Deploy to EC2 (Auth Blue-Green)
        if: success() && github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_DATA_REDIS_HOST: ${{ secrets.SPRING_DATA_REDIS_HOST }}
          SPRING_DATA_REDIS_PORT: ${{ secrets.SPRING_DATA_REDIS_PORT }}
          SPRING_DATA_REDIS_PASSWORD: ${{ secrets.SPRING_DATA_REDIS_PASSWORD }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST_AUTH_FEED }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,JWT_SECRET,SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,SPRING_DATA_REDIS_HOST,SPRING_DATA_REDIS_PORT,SPRING_DATA_REDIS_PASSWORD,SPRING_MAIL_USERNAME,SPRING_MAIL_PASSWORD
          script: |
            set -e
            echo "Docker Hub 로그인..."
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            sudo mkdir -p /opt/pet-manager
            CURRENT=$(cat /opt/pet-manager/auth_slot 2>/dev/null || echo "blue")
            if [ "$CURRENT" = "blue" ]; then
              TARGET="green"
              PORT=9091
              CONTAINER_NAME="pet-manager-auth-green"
            else
              TARGET="blue"
              PORT=9081
              CONTAINER_NAME="pet-manager-auth-blue"
            fi
            echo "현재 Auth 슬롯: $CURRENT → 배포 대상: $TARGET (포트 $PORT)"
            docker network create pet-manager-network 2>/dev/null || true
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true
            docker pull $DOCKERHUB_USERNAME/pet-manager-auth:latest
            docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              -p ${PORT}:8081 \
              --network pet-manager-network \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e JWT_SECRET="$JWT_SECRET" \
              -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
              -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              -e SPRING_DATA_REDIS_HOST="$SPRING_DATA_REDIS_HOST" \
              -e SPRING_DATA_REDIS_PORT="$SPRING_DATA_REDIS_PORT" \
              -e SPRING_DATA_REDIS_PASSWORD="$SPRING_DATA_REDIS_PASSWORD" \
              -e SPRING_MAIL_USERNAME="$SPRING_MAIL_USERNAME" \
              -e SPRING_MAIL_PASSWORD="$SPRING_MAIL_PASSWORD" \
              $DOCKERHUB_USERNAME/pet-manager-auth:latest
            echo "헬스체크 대기 (최대 60초)..."
            for i in $(seq 1 30); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 http://127.0.0.1:${PORT}/api/auth/actuator/health 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "헬스체크 성공"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "::error::헬스체크 실패 (60초 초과, 마지막 응답: $CODE)"
                echo "헬스 응답 본문:"
                curl -s --connect-timeout 2 http://127.0.0.1:${PORT}/api/auth/actuator/health || true
                docker logs $CONTAINER_NAME --tail 80
                exit 1
              fi
              sleep 2
            done
            NGINX_CFG="/etc/nginx/sites-available/pet-manager-auth-feed"
            if [ "$TARGET" = "green" ]; then
              sudo sed -i 's/server 127.0.0.1:9081;/server 127.0.0.1:9091;/' $NGINX_CFG
            else
              sudo sed -i 's/server 127.0.0.1:9091;/server 127.0.0.1:9081;/' $NGINX_CFG
            fi
            sudo nginx -t && sudo systemctl reload nginx
            echo "$TARGET" | sudo tee /opt/pet-manager/auth_slot > /dev/null
            OLD_CONTAINER="pet-manager-auth-blue"
            [ "$TARGET" = "blue" ] && OLD_CONTAINER="pet-manager-auth-green"
            docker stop $OLD_CONTAINER 2>/dev/null || true
            docker rm $OLD_CONTAINER 2>/dev/null || true
            echo "Auth 배포 완료 (활성 슬롯: $TARGET)"