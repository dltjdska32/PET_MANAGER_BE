name: Chat Service CI/CD

on:
  # push:
  #   branches: [main, dev]
  #   paths:
  #     - 'module-chat/**'
  #     - '.github/workflows/chat-ci.yml'

  workflow_dispatch:
    inputs:
      tags:
        description: '배포 버전 태그 (예: v1.0.0)'
        required: true
        default: latest
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set Version Name
        id: set-version
        run: |
          VERSION_TAG="${{ github.event.inputs.tags || 'latest' }}"
          VERSION_NAME=$(echo "$VERSION_TAG" | sed 's/\./-/g')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tags || github.ref }}

      # 선택: Docker 빌드 전 TS 컴파일 검증
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: module-chat/package-lock.json

      - name: Build Chat Module
        working-directory: module-chat
        run: |
          npm ci
          npm run build

      - name: Build Docker Image
        run: |
          docker build -f module-chat/Dockerfile \
            -t pet-manager-chat:${{ steps.set-version.outputs.VERSION_NAME }} \
            -t pet-manager-chat:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DOCKER_USER=$(echo -n "$DOCKER_USER" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="${DOCKER_USER}/pet-manager-chat"
          docker tag pet-manager-chat:latest ${IMAGE_BASE}:latest
          docker tag pet-manager-chat:${{ steps.set-version.outputs.VERSION_NAME }} \
            ${IMAGE_BASE}:${{ steps.set-version.outputs.VERSION_NAME }}
          docker push ${IMAGE_BASE}:latest
          docker push ${IMAGE_BASE}:${{ steps.set-version.outputs.VERSION_NAME }}

      - name: Deploy to EC2 (Chat)
        if: success() && github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MONGODB_URI: ${{ secrets.CHAT_MONGODB_URI }}
          REDIS_URL: ${{ secrets.CHAT_REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_CREDENTIALS_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_CREDENTIALS_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
          AWS_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        with:
          host: ${{ secrets.EC2_HOST_CHAT }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          envs: >-
            DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,MONGODB_URI,REDIS_URL,JWT_SECRET,
            AWS_CREDENTIALS_ACCESS_KEY,AWS_CREDENTIALS_SECRET_KEY,AWS_REGION,AWS_S3_BUCKET
          script: |
            set -e
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            docker network create pet-manager-network 2>/dev/null || true
            docker pull $DOCKERHUB_USERNAME/pet-manager-chat:latest

            docker stop pet-manager-chat 2>/dev/null || true
            docker rm pet-manager-chat 2>/dev/null || true

            docker run -d \
              --name pet-manager-chat \
              --restart always \
              -p 8083:8083 \
              --network pet-manager-network \
              -e MONGODB_URI="$MONGODB_URI" \
              -e REDIS_URL="$REDIS_URL" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e AWS_CREDENTIALS_ACCESS_KEY="$AWS_CREDENTIALS_ACCESS_KEY" \
              -e AWS_CREDENTIALS_SECRET_KEY="$AWS_CREDENTIALS_SECRET_KEY" \
              -e AWS_REGION="$AWS_REGION" \
              -e AWS_S3_BUCKET="$AWS_S3_BUCKET" \
              $DOCKERHUB_USERNAME/pet-manager-chat:latest

            echo "Chat 배포 완료"
            docker logs pet-manager-chat --tail 30