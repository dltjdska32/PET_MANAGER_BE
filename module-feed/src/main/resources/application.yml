server:
  port: 8082
  servlet:
    context-path: /api/feed
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1

logging:
  level:
    root: INFO

# Actuator (헬스체크) - CI 블루그린 배포용
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
      auto: false
    s3:
      bucket: ${AWS_S3_BUCKET}
    stack:
      auto: false

spring:
  application:
    name: module-feed

  profiles:
    active: local  # 로컬 개발 환경

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 100MB
      file-size-threshold: 2MB


  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}


restTemplate:
  connectTimeout: 7000
  readTimeout: 30000


redis:
  stream:
    subscribe:
      consumer: feed-consumer-1
    retry:
      consumer: feed-consumer-retry-1
      batch-size: 50
      min-idle-ms: 60000
      max-deliveries: 5
      dlq-stream-key: auth-events-dlq
      fixed-delay-ms: 5000