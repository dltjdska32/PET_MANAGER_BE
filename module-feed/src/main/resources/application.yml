server:
  port: 8082
  servlet:
    context-path: /api/feed

# Actuator (헬스체크) - CI 블루그린 배포용
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

spring:
  application:
    name: module-feed
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
