version: '3.8'

# Feed 서비스 독립 실행용 (MSA)
# 공통 인프라(MySQL, Redis)는 루트 docker-compose.yml에서 실행 후 사용
services:
  feed:
    build:
      context: ../  # 프로젝트 루트를 context로
      dockerfile: module-feed/Dockerfile
    container_name: pet-manager-feed
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://pet-manager-mysql:3306/pet_manager-feed?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: lsn
      SPRING_DATASOURCE_PASSWORD: 159159
      SPRING_DATA_REDIS_HOST: pet-manager-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: 159159
    networks:
      - pet-manager-network

networks:
  pet-manager-network:
    external: true
    name: pet-manager-network

