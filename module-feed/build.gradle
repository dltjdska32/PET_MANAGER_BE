plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.spring'
    id 'org.jetbrains.kotlin.plugin.jpa'
    id 'org.jetbrains.kotlin.kapt'
}

ext {
    QUERYDSL_VERSION = "5.0.0"
    WEBMVC_VERSION = "2.8.13"
}

dependencies {
    implementation project(':module-global')
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${WEBMVC_VERSION}"

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'

    // QueryDSL (Kotlin은 kapt)
    implementation "com.querydsl:querydsl-jpa:${QUERYDSL_VERSION}:jakarta"
    kapt "com.querydsl:querydsl-apt:${QUERYDSL_VERSION}:jakarta"
    kapt "jakarta.annotation:jakarta.annotation-api"
    kapt "jakarta.persistence:jakarta.persistence-api"

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Kotlin 컴파일
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "21"
        freeCompilerArgs += ["-Xjsr305=strict"]
    }
}

// QueryDSL 생성 경로 (Java 소스 생성 → java.srcDirs에 추가)
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile
sourceSets {
    main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = "21"
    targetCompatibility = "21"
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

kapt {
    arguments {
        arg("querydsl.generatedSourcesDir", querydslDir)
    }
    correctErrorTypes = true
}

clean.doLast {
    file(querydslDir).deleteDir()
}