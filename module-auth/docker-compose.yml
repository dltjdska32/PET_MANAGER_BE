version: '3.8'

# Auth 서비스 독립 실행용
# 민감정보는 .env 파일에 설정 (커밋되지 않음)
services:
  auth:
    build:
      context: ../  # 프로젝트 루트를 context로
      dockerfile: module-auth/Dockerfile
    container_name: pet-manager-auth
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - pet-manager-network

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: pet-manager-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pet_manager_auth
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=Asia/Seoul
    networks:
      - pet-manager-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: pet-manager-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - pet-manager-network

volumes:
  mysql_data:
  redis_data:

networks:
  pet-manager-network:
    driver: bridge

